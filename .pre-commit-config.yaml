repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: bash -c 'cd services/api && uv run ruff check .'
        language: system
        pass_filenames: false
        files: ^services/api/

      - id: ruff-format-check
        name: Ruff format check
        entry: bash -c 'cd services/api && uv run ruff format --check .'
        language: system
        pass_filenames: false
        files: ^services/api/
